name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Integration/e2e tests run only when a dedicated CI database is configured.
      CI_DATABASE_URL: ${{ secrets.CI_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm -r lint
      - name: Unit tests (packages/core)
        run: pnpm --filter @relay/core test
      - name: Routine prompt matches SPEC §9
        run: node scripts/check-routine-prompt.mjs && node scripts/sync-prompt.mjs --check
      - name: Build web
        run: pnpm --filter web build
        env:
          SKIP_ENV_VALIDATION: '1'
      - name: Integration tests
        if: env.CI_DATABASE_URL != ''
        run: pnpm --filter web test
        env:
          DATABASE_URL: ${{ secrets.CI_DATABASE_URL }}
